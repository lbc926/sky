name: Patch and sign iOS IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Source IPA URL
        required: true
        default: https://sqi.pages.dev/ios.ipa
      sky_server_hostname:
        description: SkyServerHostname override (leave blank to preserve source value)
        required: false
        default: ''
      cf_bundle_version:
        description: CFBundleVersion override (leave blank to preserve source value)
        required: false
        default: ''
      bundle_identifier:
        description: CFBundleIdentifier override (leave blank to preserve source value)
        required: false
        default: ''
      sky_build_access_key:
        description: SkyBuildAccessKey override (leave blank to preserve source value)
        required: false
        default: ''
      hex_patch_1:
        description: Custom hex patch 1 (OLD=>NEW)
        required: false
        default: ''
      hex_patch_2:
        description: Custom hex patch 2 (OLD=>NEW)
        required: false
        default: ''
      hex_patch_3:
        description: Custom hex patch 3 (OLD=>NEW)
        required: false
        default: ''
      hex_patch_4:
        description: Custom hex patch 4 (OLD=>NEW)
        required: false
        default: ''
      hex_patch_5:
        description: Custom hex patch 5 (OLD=>NEW)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sign-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Patch, inject and sign
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IPA_URL: ${{ inputs.ipa_url }}
      SKY_SERVER_HOSTNAME: ${{ inputs.sky_server_hostname }}
      CF_BUNDLE_VERSION: ${{ inputs.cf_bundle_version }}
      BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
      SKY_BUILD_ACCESS_KEY: ${{ inputs.sky_build_access_key }}
      HEX_PATCH_1: ${{ inputs.hex_patch_1 }}
      HEX_PATCH_2: ${{ inputs.hex_patch_2 }}
      HEX_PATCH_3: ${{ inputs.hex_patch_3 }}
      HEX_PATCH_4: ${{ inputs.hex_patch_4 }}
      HEX_PATCH_5: ${{ inputs.hex_patch_5 }}
      CERT_ARCHIVE: aa1122.zip
      DYLIB_FILE: 空内容永久关闭版.dylib
      OUTPUT_IPA: ios.ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CERT_ARCHIVE"
          test -f "$DYLIB_FILE"
          echo "Certificate archive: $CERT_ARCHIVE"
          echo "Injected dylib: $DYLIB_FILE"

      - name: Download and extract source IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 \
            -H 'Cache-Control: no-cache' \
            "$IPA_URL?t=$(date +%s)" \
            --output source.ipa

          python3 - <<'PY'
          from pathlib import Path
          ipa = Path("source.ipa")
          with ipa.open("rb") as handle:
              magic = handle.read(4)
          if ipa.stat().st_size <= 0 or magic != b"PK\x03\x04":
              raise SystemExit("Downloaded file is not a valid non-empty IPA/ZIP")
          print(f"Downloaded {ipa.stat().st_size} bytes")
          PY

          rm -rf unpack
          mkdir unpack
          ditto -x -k source.ipa unpack
          rm -f source.ipa

          APP_PATH="$(find unpack/Payload -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          test -f "$EXECUTABLE_PATH"

          if otool -l "$EXECUTABLE_PATH" | awk '$1 == "cryptid" && $2 != 0 { encrypted = 1 } END { exit encrypted ? 0 : 1 }'; then
            echo '::error::Source IPA executable is encrypted (cryptid != 0). Re-signing an encrypted App Store binary causes an immediate launch crash.'
            exit 1
          fi
          echo "Source executable is decrypted (all cryptid values are 0)."

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "INFO_PLIST=$INFO_PLIST" >> "$GITHUB_ENV"
          echo "EXECUTABLE_NAME=$EXECUTABLE_NAME" >> "$GITHUB_ENV"
          echo "EXECUTABLE_PATH=$EXECUTABLE_PATH" >> "$GITHUB_ENV"
          echo "App: $APP_PATH"
          echo "Executable: $EXECUTABLE_NAME"

      - name: Modify Info.plist and patch executable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          path = Path(os.environ["INFO_PLIST"])
          with path.open("rb") as handle:
              info = plistlib.load(handle)

          # Keep a trusted copy of identity/display metadata before applying any
          # user-requested overrides.  In particular, a blank Bundle Identifier
          # must mean "preserve the source value" throughout the whole workflow.
          preserved_keys = (
              "CFBundleIdentifier",
              "CFBundleDisplayName",
              "CFBundleName",
              "TeamName",
          )
          original = {key: info[key] for key in preserved_keys if key in info}
          with Path("original-info.plist").open("wb") as handle:
              plistlib.dump(original, handle, fmt=plistlib.FMT_XML, sort_keys=False)

          overrides = {
              "SkyServerHostname": os.environ.get("SKY_SERVER_HOSTNAME", "").strip(),
              "CFBundleVersion": os.environ.get("CF_BUNDLE_VERSION", "").strip(),
              "CFBundleIdentifier": os.environ.get("BUNDLE_IDENTIFIER", "").strip(),
              "SkyBuildAccessKey": os.environ.get("SKY_BUILD_ACCESS_KEY", "").strip(),
          }
          changed = False
          for key, value in overrides.items():
              if not value:
                  print(f"{key}: blank; preserving source value")
                  continue
              info[key] = value
              changed = True
              print(f"{key}: updated")

          if changed:
              with path.open("wb") as handle:
                  plistlib.dump(info, handle, fmt=plistlib.FMT_BINARY, sort_keys=False)
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["EXECUTABLE_PATH"])
          data = path.read_bytes()

          patches = [
              (
                  bytes.fromhex("000020400000803F"),
                  bytes.fromhex("000080400000803F"),
                  "float constant",
              ),
              (
                  bytes.fromhex(
                      "68 74 74 70 73 3A 2F 2F "
                      "25 73 2F 61 63 63 6F 75 "
                      "6E 74 2F 61 75 74 68 2F "
                      "6F 61 75 74 68 5F 72 65 "
                      "64 69 72 65 63 74 00 4D "
                      "6F 7A 69 6C 6C 61 2F 35 "
                      "2E 30 20 28 69 50 68 6F "
                      "6E 65 3B 20 43 50 55 20 "
                      "69 50 68 6F 6E 65"
                  ),
                  bytes.fromhex(
                      "68 74 74 70 73 3A 2F 2F "
                      "6C 69 76 65 2E 72 61 64 "
                      "69 61 6E 63 65 2E 74 68 "
                      "61 74 67 61 6D 65 63 6F "
                      "6D 70 61 6E 79 2E 63 6F "
                      "6D 2F 61 63 63 6F 75 6E "
                      "74 2F 61 75 74 68 2F 6F "
                      "61 75 74 68 5F 72 65 64 "
                      "69 72 65 63 74 00"
                  ),
                  "OAuth redirect URL",
              ),
          ]

          for index in range(1, 6):
              value = "".join(os.environ.get(f"HEX_PATCH_{index}", "").split())
              if not value:
                  print(f"custom patch {index}: blank; skipped")
                  continue
              if "=>" not in value:
                  raise SystemExit(f"custom patch {index}: expected OLD=>NEW")
              old_hex, new_hex = value.split("=>", 1)
              try:
                  old = bytes.fromhex(old_hex)
                  new = bytes.fromhex(new_hex)
              except ValueError as error:
                  raise SystemExit(f"custom patch {index}: invalid hexadecimal: {error}") from error
              if not old or not new:
                  print(f"custom patch {index}: empty side; skipped")
                  continue
              patches.append((old, new, f"custom patch {index}"))

          for old, new, label in patches:
              if len(old) != len(new):
                  raise SystemExit(f"{label}: patch lengths differ")
              old_count = data.count(old)
              new_count = data.count(new)
              if old_count:
                  data = data.replace(old, new, 1)
                  print(f"{label}: replaced first of {old_count} source match(es)")
              elif new_count:
                  print(f"{label}: already patched ({new_count} target match(es)); leaving unchanged")
              else:
                  print(f"{label}: source pattern not found; skipped")

          path.write_bytes(data)
          PY

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          with Path(os.environ["INFO_PLIST"]).open("rb") as handle:
              info = plistlib.load(handle)
          with Path("original-info.plist").open("rb") as handle:
              original = plistlib.load(handle)
          expected = {
              "SkyServerHostname": os.environ.get("SKY_SERVER_HOSTNAME", "").strip(),
              "CFBundleVersion": os.environ.get("CF_BUNDLE_VERSION", "").strip(),
              "SkyBuildAccessKey": os.environ.get("SKY_BUILD_ACCESS_KEY", "").strip(),
          }
          for key, value in expected.items():
              if value and str(info.get(key, "")) != value:
                  raise SystemExit(f"{key} verification failed")

          requested_bundle = os.environ.get("BUNDLE_IDENTIFIER", "").strip()
          expected_bundle = requested_bundle or str(original.get("CFBundleIdentifier", ""))
          if not expected_bundle:
              raise SystemExit("Source Info.plist has no CFBundleIdentifier")
          if str(info.get("CFBundleIdentifier", "")) != expected_bundle:
              raise SystemExit("CFBundleIdentifier was changed unexpectedly")

          for key in ("CFBundleDisplayName", "CFBundleName", "TeamName"):
              if key in original and info.get(key) != original[key]:
                  raise SystemExit(f"{key} was changed unexpectedly")

          policy = "explicit override" if requested_bundle else "preserved from source"
          print(f"Bundle ID policy verified ({policy}): {expected_bundle}")
          print("App/team display metadata preserved")
          print("Info.plist overrides verified")
          PY

      - name: Inject dylib into main executable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lief-venv"
          "$RUNNER_TEMP/lief-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input 'lief==0.17.6'

          mkdir -p "$APP_PATH/Frameworks"
          INJECTED_NAME="DisableBlank.dylib"
          INJECTED_PATH="$APP_PATH/Frameworks/$INJECTED_NAME"
          cp "$DYLIB_FILE" "$INJECTED_PATH"
          chmod 755 "$INJECTED_PATH"
          echo "INJECTED_PATH=$INJECTED_PATH" >> "$GITHUB_ENV"

          "$RUNNER_TEMP/lief-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import lief

          executable = Path(os.environ["EXECUTABLE_PATH"])
          load_path = "@executable_path/Frameworks/DisableBlank.dylib"
          fat = lief.MachO.parse(str(executable), config=lief.MachO.ParserConfig.deep)
          if fat is None or fat.size == 0:
              raise SystemExit("Unable to parse the main Mach-O executable")

          changed = 0
          for binary in fat:
              if binary.find_library(load_path) is None:
                  if binary.add_library(load_path) is None:
                      raise SystemExit(f"Unable to inject load command into {binary.header.cpu_type}")
                  changed += 1

          temporary = executable.with_suffix(executable.suffix + ".injected")
          fat.write(str(temporary))
          temporary.chmod(executable.stat().st_mode)
          temporary.replace(executable)
          print(f"Injected {load_path} into {changed} Mach-O slice(s)")
          PY

          otool -L "$EXECUTABLE_PATH" | grep -F '@executable_path/Frameworks/DisableBlank.dylib'
          lipo -info "$EXECUTABLE_PATH"
          lipo -info "$INJECTED_PATH"

      - name: Import certificate and prepare provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf signing-material
          mkdir signing-material
          ditto -x -k "$CERT_ARCHIVE" signing-material

          P12_FILE="$(find signing-material -type f -name '*.p12' -print -quit)"
          PROFILE_FILE="$(find signing-material -type f -name '*.mobileprovision' -print -quit)"
          PASSWORD_FILE="$(find signing-material -type f -name '*.txt' -print -quit)"
          test -f "$P12_FILE"
          test -f "$PROFILE_FILE"
          test -f "$PASSWORD_FILE"
          P12_PASSWORD="$(tr -d '\r\n' < "$PASSWORD_FILE")"
          test -n "$P12_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_FILE" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)"/\1/p' | head -n 1)"
          test -n "$SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security cms -D -i "$PROFILE_FILE" > profile.plist
          cp "$PROFILE_FILE" "$APP_PATH/embedded.mobileprovision"

          python3 - <<'PY'
          import copy
          import datetime
          import fnmatch
          import os
          import plistlib

          with open("profile.plist", "rb") as handle:
              profile = plistlib.load(handle)
          expiration = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc)
          if expiration is not None and expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if expiration is None or expiration <= now:
              raise SystemExit(f"Provisioning profile expired: {expiration}")

          profile_entitlements = profile["Entitlements"]
          app_id = str(profile_entitlements.get("application-identifier", ""))
          if "." not in app_id:
              raise SystemExit("Provisioning profile has no valid application-identifier")
          team_prefix, profile_bundle = app_id.split(".", 1)
          with open(os.environ["INFO_PLIST"], "rb") as handle:
              current_bundle = str(plistlib.load(handle).get("CFBundleIdentifier", "")).strip()
          if not current_bundle:
              raise SystemExit("App Info.plist has no CFBundleIdentifier")

          if not fnmatch.fnmatchcase(current_bundle, profile_bundle):
              raise SystemExit(
                  f"Bundle ID {current_bundle} does not match profile {profile_bundle}. "
                  "The workflow will not replace the Bundle ID; use a compatible "
                  "provisioning profile or enter an explicit Bundle Identifier."
              )

          # Provisioning profiles commonly contain wildcard values.  codesign
          # must receive concrete identifiers for the bundle being signed or the
          # installed app can terminate immediately during launch validation.
          entitlements = copy.deepcopy(profile_entitlements)
          if str(entitlements.get("application-identifier", "")).endswith(".*"):
              entitlements["application-identifier"] = f"{team_prefix}.{current_bundle}"

          keychain_groups = entitlements.get("keychain-access-groups")
          if isinstance(keychain_groups, list):
              entitlements["keychain-access-groups"] = [
                  f"{team_prefix}.{current_bundle}" if str(group).endswith(".*") else group
                  for group in keychain_groups
              ]

          with open("entitlements.plist", "wb") as handle:
              plistlib.dump(entitlements, handle, fmt=plistlib.FMT_XML, sort_keys=False)

          print("Profile:", profile.get("Name"))
          print("Profile expires:", expiration.isoformat())
          print("Bundle ID:", current_bundle)
          print("Signing Team ID (from profile):", entitlements.get("com.apple.developer.team-identifier"))
          print("Application identifier:", entitlements.get("application-identifier"))
          PY

          echo "Signing identity: $SIGNING_IDENTITY"

      - name: Re-sign app bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$APP_PATH/_CodeSignature"

          # Preserve the original package tree.  Do not delete PlugIns, Watch,
          # resources, or other payload content to make signing appear successful.

          while IFS= read -r -d '' item; do
            echo "Signing nested item: $item"
            codesign --remove-signature "$item" 2>/dev/null || true
            if [[ "$item" == *.appex ]]; then
              codesign --force --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" \
                --timestamp=none --generate-entitlement-der \
                --preserve-metadata=identifier,entitlements \
                "$item"
            else
              codesign --force --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" \
                --timestamp=none --generate-entitlement-der \
                "$item"
            fi
          done < <(find "$APP_PATH" -depth \( \
            -type d -name '*.framework' -o \
            -type d -name '*.appex' -o \
            -type f -name '*.dylib' \
          \) -print0)

          codesign --force --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --timestamp=none --generate-entitlement-der \
            --entitlements entitlements.plist \
            "$APP_PATH"

          codesign --verify --strict --verbose=2 "$INJECTED_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --verbose=4 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > signed-entitlements.plist 2>/dev/null
          test -s signed-entitlements.plist

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          with Path(os.environ["INFO_PLIST"]).open("rb") as handle:
              info = plistlib.load(handle)
          with Path("original-info.plist").open("rb") as handle:
              original = plistlib.load(handle)
          with Path("entitlements.plist").open("rb") as handle:
              expected_entitlements = plistlib.load(handle)
          with Path("signed-entitlements.plist").open("rb") as handle:
              signed_entitlements = plistlib.load(handle)

          requested_bundle = os.environ.get("BUNDLE_IDENTIFIER", "").strip()
          expected_bundle = requested_bundle or str(original.get("CFBundleIdentifier", ""))
          actual_bundle = str(info.get("CFBundleIdentifier", ""))
          if actual_bundle != expected_bundle:
              raise SystemExit(
                  f"Final Bundle ID changed unexpectedly: {actual_bundle} != {expected_bundle}"
              )

          expected_app_id = str(expected_entitlements.get("application-identifier", ""))
          signed_app_id = str(signed_entitlements.get("application-identifier", ""))
          if not expected_app_id or signed_app_id != expected_app_id:
              raise SystemExit(
                  f"Signed application-identifier mismatch: {signed_app_id} != {expected_app_id}"
              )
          if not signed_app_id.endswith(f".{actual_bundle}"):
              raise SystemExit(
                  f"Signed application-identifier does not contain Bundle ID {actual_bundle}"
              )

          expected_team = str(
              expected_entitlements.get("com.apple.developer.team-identifier", "")
          )
          signed_team = str(
              signed_entitlements.get("com.apple.developer.team-identifier", "")
          )
          if expected_team and signed_team != expected_team:
              raise SystemExit(f"Signed Team ID mismatch: {signed_team} != {expected_team}")

          for key in ("CFBundleDisplayName", "CFBundleName", "TeamName"):
              if key in original and info.get(key) != original[key]:
                  raise SystemExit(f"Final {key} changed unexpectedly")

          print("Final Bundle ID:", actual_bundle)
          print("Final application identifier:", signed_app_id)
          print("Final signing Team ID:", signed_team or "not present")
          print("App/team display metadata preserved")
          print("Injected dylib and complete app signatures verified")
          PY

          if otool -l "$EXECUTABLE_PATH" | awk '$1 == "cryptid" && $2 != 0 { encrypted = 1 } END { exit encrypted ? 0 : 1 }'; then
            echo '::error::Final executable unexpectedly has cryptid != 0.'
            exit 1
          fi
          echo "Final executable remains decrypted (all cryptid values are 0)."

      - name: Package signed IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUTPUT_IPA"
          (
            cd unpack
            ditto -c -k --sequesterRsrc --keepParent Payload "../$OUTPUT_IPA"
          )
          test -s "$OUTPUT_IPA"
          shasum -a 256 "$OUTPUT_IPA" | tee "$OUTPUT_IPA.sha256"
          ls -lh "$OUTPUT_IPA" "$OUTPUT_IPA.sha256"

          {
            echo '## Signed IPA'
            echo
            echo "- Source: $IPA_URL"
            if [[ -n "$SKY_SERVER_HOSTNAME" ]]; then
              echo "- SkyServerHostname: \`$SKY_SERVER_HOSTNAME\`"
            else
              echo '- SkyServerHostname: preserved from source IPA'
            fi
            echo '- Injected: `DisableBlank.dylib`'
            echo "- Output: $OUTPUT_IPA"
            echo
            echo '```text'
            cat "$OUTPUT_IPA.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed IPA to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: sky
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$OUTPUT_IPA" "s3://${R2_BUCKET_NAME}/ios.ipa" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          REMOTE_SIZE="$(aws s3api head-object --bucket "$R2_BUCKET_NAME" --key ios.ipa \
            --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)"
          test "$REMOTE_SIZE" = "$(stat -f%z "$OUTPUT_IPA")"
          echo "Uploaded ios.ipa to R2 (${REMOTE_SIZE} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean failed R2 multipart uploads
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: sky
        shell: bash
        run: |
          set +e
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ACCOUNT_ID" ]]; then
            echo 'R2 credentials are unavailable; no multipart upload was started.'
            exit 0
          fi
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-multipart-uploads --bucket "$R2_BUCKET_NAME" --prefix ios.ipa \
            --endpoint-url "$R2_ENDPOINT" \
            --query "Uploads[?Key=='ios.ipa'].[Key,UploadId]" --output text |
          while read -r key upload_id; do
            [[ -n "$key" && -n "$upload_id" ]] || continue
            aws s3api abort-multipart-upload --bucket "$R2_BUCKET_NAME" --key "$key" \
              --upload-id "$upload_id" --endpoint-url "$R2_ENDPOINT"
            echo "Aborted incomplete R2 upload: $key ($upload_id)"
          done

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
